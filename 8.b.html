<!DOCTYPE html>
<html lang="en">
<body>
  <script>
    const n1 = parseInt(prompt("Enter first integer:"));
    const n2 = parseInt(prompt("Enter second integer:"));
    const n3 = parseInt(prompt("Enter third integer:"));

    if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
      document.write("<h2>Please enter valid integers.</h2>");
    } else if (n1 === n2 && n2 === n3) {
      const msg = "EQUAL NUMBERS";
      alert(msg);
      document.write(`<h2>${msg}</h2>`);
    } else {
      const max = Math.max(n1, n2, n3);
      const msg = `${max} LARGER NUMBER`;
      alert(msg);
      document.write(`<h2>${msg}</h2>`);
    }
  </script>
</body>
</html>
